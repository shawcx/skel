name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tornado "setuptools>=77" pytest "sqlalchemy[asyncio]" alembic aiosqlite
      - run: python test/smoke.py

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # the generated Makefiles need a POSIX shell, Git Bash on Windows
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress
      - run: python -m pip install tornado
      - run: python test/frontend.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install tornado pytest "sqlalchemy[asyncio]" alembic asyncpg
      - run: python test/docker.py
